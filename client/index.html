<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <meta name="theme-color" content="#070b0f">

  <title>LAST LINE</title>

  <style>
    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      background: #070b0f;
      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
    }


    /* =====================================================
       GAME CANVAS
    ===================================================== */

    #game {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    #game canvas {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;
    }


    /* =====================================================
       MAIN UI
    ===================================================== */

    #ui {
      position: fixed;
      inset: 0;

      z-index: 20;

      pointer-events: none;
    }


    /* =====================================================
       MENU
    ===================================================== */

    #menu {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(35, 190, 220, 0.12),
          transparent 34%
        ),
        radial-gradient(
          circle at 50% 80%,
          rgba(0, 80, 100, 0.10),
          transparent 42%
        ),
        #06090d;

      pointer-events: auto;
    }

    .menuBox {
      width: min(520px, 92vw);

      padding: 38px;

      border:
        1px solid
        rgba(120, 220, 240, 0.24);

      background:
        linear-gradient(
          145deg,
          rgba(17, 24, 31, 0.97),
          rgba(7, 11, 15, 0.97)
        );

      box-shadow:
        0 30px 100px
        rgba(0, 0, 0, 0.7);

      backdrop-filter: blur(12px);
    }

    .logo {
      text-align: center;

      font-size:
        clamp(42px, 10vw, 68px);

      line-height: 0.95;

      font-weight: 900;

      letter-spacing: 0.10em;
    }

    .logo span {
      color: #55e6ff;
    }

    .sub {
      margin-top: 16px;
      margin-bottom: 34px;

      text-align: center;

      color: #71818b;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 0.28em;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      color: #7f8b93;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 0.16em;
    }

    .field input,
    .field select {
      width: 100%;

      height: 50px;

      padding:
        0 14px;

      border:
        1px solid
        rgba(255,255,255,0.12);

      border-radius: 6px;

      outline: none;

      background: #0c1319;

      color: #ffffff;

      font-size: 15px;
    }

    .field input:focus,
    .field select:focus {
      border-color:
        rgba(85,230,255,0.55);

      box-shadow:
        0 0 0 2px
        rgba(85,230,255,0.08);
    }

    .actions {
      margin-top: 22px;
    }

    #deployButton {
      width: 100%;

      height: 58px;

      border:
        1px solid
        rgba(130,235,255,0.65);

      border-radius: 6px;

      background:
        linear-gradient(
          180deg,
          #dce4e7,
          #aeb9be
        );

      color: #101417;

      font-size: 15px;

      font-weight: 900;

      letter-spacing: 0.22em;

      cursor: pointer;

      touch-action: manipulation;
    }

    #deployButton:active {
      transform: scale(0.985);
    }

    #deployButton:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #menuStatus {
      min-height: 18px;

      margin-top: 14px;

      text-align: center;

      color: #55e6ff;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 0.12em;
    }

    .menuFooter {
      margin-top: 22px;

      text-align: center;

      color: #4f5a61;

      font-size: 9px;

      letter-spacing: 0.14em;
    }


    /* =====================================================
       LOADING
    ===================================================== */

    #loadingScreen {
      position: fixed;
      inset: 0;

      z-index: 300;

      display: none;

      align-items: center;
      justify-content: center;

      background:
        rgba(3,6,9,0.96);

      pointer-events: auto;
    }

    .loadingBox {
      width: min(380px, 80vw);

      text-align: center;
    }

    .loadingTitle {
      margin-bottom: 20px;

      color: #ffffff;

      font-size: 18px;

      font-weight: 900;

      letter-spacing: 0.25em;
    }

    .loadingTrack {
      width: 100%;
      height: 4px;

      overflow: hidden;

      background:
        rgba(255,255,255,0.10);
    }

    #loadingProgress {
      width: 0%;
      height: 100%;

      background: #55e6ff;

      transition:
        width 0.08s linear;
    }

    .loadingText {
      margin-top: 12px;

      color: #65737b;

      font-size: 9px;

      letter-spacing: 0.18em;
    }


    /* =====================================================
       BASIC FALLBACK HUD
    ===================================================== */

    #fallbackHud {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 30;

      pointer-events: none;
    }

    .fallbackTop {
      position: absolute;

      top:
        max(14px, env(safe-area-inset-top));

      left: 14px;
      right: 14px;

      display: flex;

      justify-content: space-between;

      gap: 8px;
    }

    .fallbackCard {
      padding: 8px 11px;

      background:
        rgba(5,9,13,0.68);

      border:
        1px solid
        rgba(255,255,255,0.10);

      backdrop-filter: blur(5px);
    }

    .fallbackLabel {
      color: #748088;

      font-size: 8px;

      font-weight: 700;

      letter-spacing: 0.15em;
    }

    .fallbackValue {
      margin-top: 2px;

      color: #ffffff;

      font-size: 15px;

      font-weight: 900;
    }

    #fallbackCrosshair {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 22px;
      height: 22px;

      transform:
        translate(-50%, -50%);
    }

    #fallbackCrosshair::before,
    #fallbackCrosshair::after {
      content: "";

      position: absolute;

      background:
        rgba(255,255,255,0.88);
    }

    #fallbackCrosshair::before {
      left: 10px;
      top: 0;

      width: 2px;
      height: 22px;
    }

    #fallbackCrosshair::after {
      left: 0;
      top: 10px;

      width: 22px;
      height: 2px;
    }


    /* =====================================================
       MOBILE CONTROLS
    ===================================================== */

    #mobile {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 80;

      pointer-events: none;
    }

    /*
      TouchControls.js can use these areas.
      They remain invisible except for the controls
      themselves.
    */

    #moveArea {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 48%;
      height: 48%;

      pointer-events: auto;
    }

    #lookArea {
      position: absolute;

      right: 0;
      top: 0;

      width: 58%;
      height: 70%;

      pointer-events: auto;
    }

    .touchStick {
      position: absolute;

      width: 132px;
      height: 132px;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,0.15);

      background:
        rgba(255,255,255,0.045);

      pointer-events: none;
    }

    #moveStick {
      left: 24px;
      bottom: 28px;
    }

    .touchKnob {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 54px;
      height: 54px;

      margin:
        -27px 0 0 -27px;

      border-radius: 50%;

      border:
        1px solid
        rgba(85,230,255,0.45);

      background:
        rgba(85,230,255,0.16);
    }

    .touchButton {
      position: absolute;

      width: 64px;
      height: 64px;

      padding: 0;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,0.18);

      background:
        rgba(10,16,22,0.65);

      color: #ffffff;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 0.08em;

      pointer-events: auto;

      touch-action: none;
    }

    #shootButton {
      right: 28px;
      bottom: 42px;

      width: 76px;
      height: 76px;

      border-color:
        rgba(255,90,100,0.5);

      background:
        rgba(120,20,30,0.45);
    }

    #reloadButton {
      right: 30px;
      bottom: 132px;
    }

    #sprintButton {
      left: 170px;
      bottom: 38px;
    }

    #crouchButton {
      right: 112px;
      bottom: 38px;
    }

    #jumpButton {
      right: 112px;
      bottom: 112px;
    }


    /* =====================================================
       MOBILE ACTIVE STATE
    ===================================================== */

    body.game-active #mobile {
      display: block;
    }

    body.game-active #fallbackHud {
      display: block;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (pointer: coarse) {

      #mobile {
        display: none;
      }

      body.game-active #mobile {
        display: block;
      }

    }

    @media (max-width: 700px) {

      .menuBox {
        padding: 28px 22px;
      }

      .sub {
        margin-bottom: 26px;
      }

    }

    @media (orientation: landscape)
      and (pointer: coarse) {

      #moveStick {
        left: 22px;
        bottom: 18px;
      }

      #shootButton {
        right: 24px;
        bottom: 24px;
      }

      #reloadButton {
        right: 26px;
        bottom: 112px;
      }

    }


    /* =====================================================
       NO AUDIO / STATUS
    ===================================================== */

    .silentBadge {
      margin-top: 10px;

      text-align: center;

      color: #465158;

      font-size: 8px;

      letter-spacing: 0.14em;
    }

  </style>
</head>


<body>

  <!-- ===================================================
       THREE.JS GAME
  ==================================================== -->

  <main id="game"></main>


  <!-- ===================================================
       UI
  ==================================================== -->

  <div id="ui">


    <!-- ================================================
         MAIN MENU
    ================================================= -->

    <section id="menu">

      <div class="menuBox">

        <div class="logo">
          LAST <span>LINE</span>
        </div>

        <div class="sub">
          TACTICAL FPS
        </div>


        <div class="field">

          <label for="callsign">
            CALLSIGN
          </label>

          <input
            id="callsign"
            type="text"
            value="PHANTOM"
            maxlength="16"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
          >

        </div>


        <div class="field">

          <label for="operation">
            OPERATION
          </label>

          <select id="operation">

            <option value="RESCUE">
              RESCUE HOSTAGE
            </option>

            <option value="SURVIVAL">
              SURVIVAL
            </option>

            <option value="TDM">
              TEAM DEATHMATCH
            </option>

            <option value="HVT">
              HIGH VALUE TARGET
            </option>

          </select>

        </div>


        <div class="actions">

          <button
            id="deployButton"
            type="button"
          >
            DEPLOY
          </button>

        </div>


        <div id="menuStatus">
          SYSTEM READY
        </div>


        <div class="menuFooter">
          TOUCH / MOUSE CONTROLS
        </div>

        <div class="silentBadge">
          NO AUDIO
        </div>

      </div>

    </section>


    <!-- ================================================
         LOADING SCREEN
    ================================================= -->

    <section id="loadingScreen">

      <div class="loadingBox">

        <div class="loadingTitle">
          LAST LINE
        </div>

        <div class="loadingTrack">

          <div id="loadingProgress"></div>

        </div>

        <div class="loadingText">
          INITIALIZING OPERATIONS
        </div>

      </div>

    </section>


    <!-- ================================================
         FALLBACK HUD
    ================================================= -->

    <section id="fallbackHud">

      <div class="fallbackTop">

        <div class="fallbackCard">

          <div class="fallbackLabel">
            CALLSIGN
          </div>

          <div
            class="fallbackValue"
            id="fallbackCallsign"
          >
            PHANTOM
          </div>

        </div>


        <div class="fallbackCard">

          <div class="fallbackLabel">
            STATUS
          </div>

          <div
            class="fallbackValue"
            id="fallbackStatus"
          >
            READY
          </div>

        </div>

      </div>


      <div id="fallbackCrosshair"></div>

    </section>


    <!-- ================================================
         MOBILE CONTROLS
    ================================================= -->

    <section id="mobile">

      <!-- movement touch area -->

      <div id="moveArea">

        <div
          class="touchStick"
          id="moveStick"
        >

          <div class="touchKnob"></div>

        </div>

      </div>


      <!-- camera look area -->

      <div id="lookArea"></div>


      <!-- action buttons -->

      <button
        class="touchButton"
        id="shootButton"
        type="button"
      >
        FIRE
      </button>


      <button
        class="touchButton"
        id="reloadButton"
        type="button"
      >
        RELOAD
      </button>


      <button
        class="touchButton"
        id="sprintButton"
        type="button"
      >
        SPRINT
      </button>


      <button
        class="touchButton"
        id="crouchButton"
        type="button"
      >
        CROUCH
      </button>


      <button
        class="touchButton"
        id="jumpButton"
        type="button"
      >
        JUMP
      </button>

    </section>

  </div>


  <!-- ===================================================
       GAME ENTRY
       IMPORTANT: this is the ONLY script we need here.
  ==================================================== -->

  <script type="module" src="./src/main.js"></script>

</body>
</html>
