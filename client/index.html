<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <meta name="theme-color" content="#080b0d">

  <title>LAST LINE</title>

  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/menu.css">
  <link rel="stylesheet" href="./styles/hud.css">
  <link rel="stylesheet" href="./styles/mobile.css">
</head>

<body>

  <!-- =====================================================
       GAME
       ===================================================== -->

  <main id="game">
    <!-- Three.js canvas is created by main.js -->
  </main>


  <!-- =====================================================
       MAIN MENU
       ===================================================== -->

  <section id="menu">

    <div class="menu-background"></div>

    <div class="menu-panel">

      <div class="game-logo">
        LAST LINE
      </div>

      <div class="game-subtitle">
        TACTICAL OPERATIONS
      </div>

      <div class="menu-divider"></div>

      <label for="callsign">
        CALLSIGN
      </label>

      <input
        id="callsign"
        type="text"
        maxlength="16"
        autocomplete="off"
        spellcheck="false"
        placeholder="ENTER CALLSIGN"
      >

      <button
        id="deployButton"
        type="button"
      >
        DEPLOY
      </button>

      <div id="menuStatus">
        SYSTEM READY
      </div>

    </div>

  </section>


  <!-- =====================================================
       HUD
       ===================================================== -->

  <section
    id="hud"
    aria-hidden="true"
  >

    <!-- Crosshair -->

    <div id="crosshair">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>


    <!-- Top objective -->

    <div id="objectiveHud">

      <div class="hud-label">
        OBJECTIVE
      </div>

      <div id="objectiveText">
        WAITING FOR DEPLOYMENT
      </div>

    </div>


    <!-- Player status -->

    <div id="playerHud">

      <div class="hud-label">
        HEALTH
      </div>

      <div class="status-row">

        <div class="status-bar">
          <div
            id="healthBar"
            class="status-fill"
          ></div>
        </div>

        <div id="healthText">
          100
        </div>

      </div>


      <div class="hud-label armor-label">
        ARMOR
      </div>

      <div class="status-row">

        <div class="status-bar">
          <div
            id="armorBar"
            class="status-fill"
          ></div>
        </div>

        <div id="armorText">
          100
        </div>

      </div>

    </div>


    <!-- Weapon / ammo -->

    <div id="weaponHud">

      <div id="weaponName">
        CARBINE
      </div>

      <div id="ammoText">
        <span id="currentAmmo">
          30
        </span>

        <span class="ammo-divider">
          /
        </span>

        <span id="reserveAmmo">
          120
        </span>
      </div>

      <div id="reloadIndicator">
        RELOAD
      </div>

    </div>


    <!-- Level / XP -->

    <div id="levelHud">

      <div>
        LEVEL
        <span id="levelText">
          1
        </span>
      </div>

      <div class="xp-bar">

        <div
          id="xpBar"
          class="xp-fill"
        ></div>

      </div>

      <div id="xpText">
        0 / 100 XP
      </div>

    </div>


    <!-- Mission notification -->

    <div id="missionNotification">
      <div id="missionNotificationTitle"></div>
      <div id="missionNotificationText"></div>
    </div>


    <!-- Damage vignette -->

    <div id="damageVignette"></div>


    <!-- Hit marker -->

    <div id="hitMarker">
      ×
    </div>

  </section>


  <!-- =====================================================
       MOBILE FPS CONTROLS
       ===================================================== -->

  <section id="mobileControls">

    <!-- Left movement joystick -->

    <div
      id="movementJoystick"
      class="touch-control"
    >

      <div
        id="movementJoystickKnob"
      ></div>

    </div>


    <!-- Right side is the camera/look area -->

    <div
      id="lookArea"
      class="touch-control"
    ></div>


    <!-- Fire -->

    <button
      id="shootButton"
      class="mobile-button shoot-button"
      type="button"
    >
      FIRE
    </button>


    <!-- Reload -->

    <button
      id="reloadButton"
      class="mobile-button reload-button"
      type="button"
    >
      R
    </button>


    <!-- Crouch -->

    <button
      id="crouchButton"
      class="mobile-button crouch-button"
      type="button"
    >
      C
    </button>


    <!-- Sprint -->

    <button
      id="sprintButton"
      class="mobile-button sprint-button"
      type="button"
    >
      SPRINT
    </button>


    <!-- Jump -->

    <button
      id="jumpButton"
      class="mobile-button jump-button"
      type="button"
    >
      JUMP
    </button>


    <!-- Weapon switching -->

    <div id="weaponButtons">

      <button
        id="weapon1Button"
        class="weapon-button"
        type="button"
      >
        1
      </button>

      <button
        id="weapon2Button"
        class="weapon-button"
        type="button"
      >
        2
      </button>

      <button
        id="weapon3Button"
        class="weapon-button"
        type="button"
      >
        3
      </button>

    </div>

  </section>


  <!-- =====================================================
       LOADING SCREEN
       ===================================================== -->

  <section id="loadingScreen">

    <div class="loading-panel">

      <div class="loading-title">
        LAST LINE
      </div>

      <div class="loading-text">
        INITIALIZING OPERATIONS
      </div>

      <div class="loading-bar">
        <div id="loadingProgress"></div>
      </div>

    </div>

  </section>


  <!-- =====================================================
       GAME SCRIPTS
       ===================================================== -->

  <script type="module" src="./src/main.js"></script>

</body>
</html>
