<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>LAST LINE</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071018;
      color: #eafcff;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      touch-action: none;
      user-select: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    /* =====================================================
       THREE.JS GAME
    ===================================================== */

    #game {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* =====================================================
       MENU
    ===================================================== */

    #menu {
      position: fixed;
      inset: 0;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 50% 40%,
          rgba(22, 72, 86, 0.22),
          transparent 45%
        ),
        linear-gradient(
          135deg,
          rgba(3, 9, 13, 0.97),
          rgba(7, 16, 24, 0.94)
        );
    }

    .menuBox {
      width: min(470px, 94vw);

      padding: 38px;

      border: 1px solid rgba(76, 222, 255, 0.25);

      background:
        linear-gradient(
          145deg,
          rgba(15, 28, 36, 0.94),
          rgba(7, 15, 21, 0.97)
        );

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.55),
        inset 0 0 40px rgba(49, 217, 255, 0.025);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .logo {
      font-size: 58px;
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #f4fdff;
    }

    .logo span {
      color: #36e7ff;
    }

    .sub {
      margin-top: 10px;
      margin-bottom: 34px;

      color: rgba(190, 225, 234, 0.55);

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.24em;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;

      margin-bottom: 8px;

      color: rgba(185, 226, 235, 0.55);

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .field input,
    .field select {
      width: 100%;
      height: 52px;

      padding: 0 15px;

      border: 1px solid rgba(88, 217, 240, 0.18);
      border-radius: 3px;

      outline: none;

      background: rgba(0, 0, 0, 0.28);
      color: #eafcff;

      font-size: 14px;
      letter-spacing: 0.06em;
    }

    .field input:focus,
    .field select:focus {
      border-color: rgba(54, 231, 255, 0.6);
      box-shadow: 0 0 0 2px rgba(54, 231, 255, 0.06);
    }

    .field select option {
      background: #0a151c;
      color: white;
    }

    .actions {
      margin-top: 26px;
    }

    #deployButton {
      width: 100%;
      height: 58px;

      border: 1px solid rgba(54, 231, 255, 0.7);
      border-radius: 3px;

      background:
        linear-gradient(
          135deg,
          rgba(36, 171, 193, 0.25),
          rgba(12, 65, 77, 0.35)
        );

      color: #dffcff;

      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.22em;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    #deployButton:hover {
      background:
        linear-gradient(
          135deg,
          rgba(36, 201, 226, 0.42),
          rgba(12, 83, 98, 0.48)
        );

      box-shadow:
        0 0 30px rgba(54, 231, 255, 0.12);
    }

    #deployButton:active {
      transform: scale(0.985);
    }

    #deployButton:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #menuStatus {
      min-height: 18px;

      margin-top: 16px;

      color: #63eaff;

      text-align: center;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    /* =====================================================
       LOADING
    ===================================================== */

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          rgba(13, 48, 58, 0.38),
          rgba(3, 8, 12, 0.98)
        );
    }

    .loadingBox {
      width: min(360px, 80vw);
      text-align: center;
    }

    .loadingTitle {
      margin-bottom: 18px;

      color: #dffcff;

      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.24em;
    }

    .loadingTrack {
      width: 100%;
      height: 3px;

      overflow: hidden;

      background: rgba(255,255,255,0.08);
    }

    #loadingProgress {
      width: 0%;
      height: 100%;

      background: #36e7ff;

      box-shadow:
        0 0 14px rgba(54, 231, 255, 0.7);

      transition: width 0.08s linear;
    }

    /* =====================================================
       HUD
    ===================================================== */

    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;

      display: none;

      pointer-events: none;
    }

    .hudTop {
      position: absolute;

      top: 18px;
      left: 18px;
      right: 18px;

      display: flex;
      gap: 10px;
    }

    .hudCard {
      min-width: 120px;

      padding: 10px 13px;

      border: 1px solid rgba(91, 211, 231, 0.16);

      background: rgba(4, 12, 17, 0.58);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .hudSmall {
      color: rgba(186, 227, 236, 0.45);

      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .hudBig {
      margin-top: 3px;

      color: #ecfcff;

      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    #objective {
      position: absolute;

      top: 88px;
      left: 50%;

      transform: translateX(-50%);

      max-width: 90vw;

      padding: 8px 14px;

      border: 1px solid rgba(75, 211, 234, 0.12);

      background: rgba(4, 12, 17, 0.48);

      color: rgba(224, 249, 255, 0.78);

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;

      text-align: center;

      white-space: nowrap;
    }

    /* =====================================================
       CROSSHAIR
    ===================================================== */

    #crosshair {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 18px;
      height: 18px;

      transform: translate(-50%, -50%);
    }

    #crosshair::before,
    #crosshair::after {
      content: "";

      position: absolute;

      background: rgba(226, 252, 255, 0.88);
    }

    #crosshair::before {
      left: 8px;
      top: 2px;

      width: 2px;
      height: 14px;
    }

    #crosshair::after {
      left: 2px;
      top: 8px;

      width: 14px;
      height: 2px;
    }

    /* =====================================================
       BOTTOM HUD
    ===================================================== */

    #bottomHud {
      position: absolute;

      left: 18px;
      right: 18px;
      bottom: 18px;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
    }

    .hudPanel {
      padding: 11px 14px;

      border: 1px solid rgba(91, 211, 231, 0.16);

      background: rgba(4, 12, 17, 0.64);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #healthPanel {
      width: min(280px, 42vw);
    }

    .healthRow {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 7px;
    }

    #hpText {
      color: #eaffff;

      font-size: 12px;
      font-weight: 900;
    }

    .bar {
      width: 100%;
      height: 5px;

      background: rgba(255,255,255,0.08);

      overflow: hidden;
    }

    #hpFill {
      width: 100%;
      height: 100%;

      background: #42e8b1;

      transition: width 0.15s ease;
    }

    #weaponPanel {
      min-width: 180px;
      text-align: right;
    }

    #weaponName {
      color: rgba(187, 229, 238, 0.55);

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    #ammo {
      margin-top: 3px;

      color: #f0fdff;

      font-size: 25px;
      font-weight: 900;
    }

    #ammo span {
      color: rgba(213, 244, 249, 0.35);
      font-size: 13px;
    }

    #message {
      position: absolute;

      left: 50%;
      bottom: 27%;

      transform: translateX(-50%);

      color: #dffcff;

      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.18em;

      text-align: center;

      text-shadow:
        0 2px 18px rgba(0,0,0,0.8);
    }

    /* =====================================================
       MOBILE CONTROLS
       IMPORTANT: HIDDEN UNTIL CORE DEPLOYS
    ===================================================== */

    #mobile {
      position: fixed;
      inset: 0;

      z-index: 30;

      display: none;

      pointer-events: none;
    }

    .stick {
      position: absolute;

      width: 132px;
      height: 132px;

      border-radius: 50%;

      border: 1px solid rgba(76, 224, 248, 0.22);

      background: rgba(7, 20, 27, 0.25);

      pointer-events: auto;

      touch-action: none;
    }

    #moveStick {
      left: 24px;
      bottom: 24px;
    }

    #lookStick {
      right: 24px;
      bottom: 24px;
    }

    .knob {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 54px;
      height: 54px;

      margin-left: -27px;
      margin-top: -27px;

      border-radius: 50%;

      background: rgba(54, 231, 255, 0.2);

      border: 1px solid rgba(54, 231, 255, 0.4);

      box-shadow:
        0 0 18px rgba(54, 231, 255, 0.08);

      pointer-events: none;
    }

    .mobileButton {
      position: absolute;

      width: 68px;
      height: 68px;

      border-radius: 50%;

      border: 1px solid rgba(133, 232, 250, 0.25);

      color: #e8fcff;

      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;

      pointer-events: auto;

      touch-action: none;
    }

    #fire {
      right: 42%;
      bottom: 30px;

      background: rgba(178, 31, 48, 0.38);
    }

    #reload {
      right: 24px;
      bottom: 176px;

      width: 58px;
      height: 58px;

      background: rgba(255,255,255,0.08);
    }

    #crouch {
      right: 102px;
      bottom: 178px;

      width: 54px;
      height: 54px;

      background: rgba(255,255,255,0.07);
    }

    #sprint {
      left: 175px;
      bottom: 34px;

      width: 58px;
      height: 58px;

      background: rgba(255,255,255,0.07);
    }

    #jump {
      right: 102px;
      bottom: 30px;

      width: 54px;
      height: 54px;

      background: rgba(255,255,255,0.07);
    }

    /* =====================================================
       DESKTOP
    ===================================================== */

    @media (pointer: fine) {
      #mobile {
        display: none !important;
      }
    }

    /* =====================================================
       PHONE
    ===================================================== */

    @media (max-width: 700px) {
      .menuBox {
        padding: 27px;
      }

      .logo {
        font-size: 48px;
      }

      .sub {
        font-size: 9px;
      }

      .hudTop {
        top: 10px;
        left: 10px;
        right: 10px;
      }

      .hudCard {
        min-width: 0;
        flex: 1;
        padding: 8px 9px;
      }

      .hudTop .hudCard:nth-child(2) {
        display: none;
      }

      #objective {
        top: 75px;
        font-size: 8px;
      }

      #bottomHud {
        left: 10px;
        right: 10px;
        bottom: 10px;
      }

      #healthPanel {
        width: 42vw;
      }

      #weaponPanel {
        min-width: 0;
      }

      .stick {
        width: 124px;
        height: 124px;
      }

      #moveStick {
        left: 16px;
        bottom: 16px;
      }

      #lookStick {
        right: 16px;
        bottom: 16px;
      }

      #fire {
        right: 35%;
        bottom: 20px;
      }

      #reload {
        right: 15px;
        bottom: 158px;
      }

      #crouch {
        right: 88px;
        bottom: 158px;
      }

      #jump {
        right: 88px;
        bottom: 18px;
      }

      #sprint {
        left: 154px;
        bottom: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       THREE.JS CANVAS CONTAINER
  ====================================================== -->

  <div id="game"></div>


  <!-- =====================================================
       MAIN MENU
  ====================================================== -->

  <div id="menu">

    <div class="menuBox">

      <div class="logo">
        LAST <span>LINE</span>
      </div>

      <div class="sub">
        TACTICAL CO-OP OPERATIONS
      </div>


      <div class="field">

        <label for="callsign">
          CALLSIGN
        </label>

        <input
          id="callsign"
          value="Phantom"
          maxlength="16"
          autocomplete="off"
          spellcheck="false"
        >

      </div>


      <div class="field">

        <label for="mode">
          OPERATION
        </label>

        <select id="mode">

          <option value="rescue">
            RESCUE THE HOSTAGE
          </option>

          <option value="survival">
            SURVIVAL
          </option>

          <option value="tdm">
            TEAM DEATHMATCH
          </option>

          <option value="hvt">
            HIGH VALUE TARGET
          </option>

        </select>

      </div>


      <div class="actions">

        <button
          id="deployButton"
          type="button"
        >
          DEPLOY
        </button>

      </div>


      <div id="menuStatus"></div>

    </div>

  </div>


  <!-- =====================================================
       LOADING SCREEN
  ====================================================== -->

  <div id="loadingScreen">

    <div class="loadingBox">

      <div class="loadingTitle">
        INITIALIZING OPERATION
      </div>

      <div class="loadingTrack">

        <div id="loadingProgress"></div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       HUD
  ====================================================== -->

  <div id="hud">

    <div class="hudTop">

      <div class="hudCard">

        <div class="hudSmall">
          CALLSIGN
        </div>

        <div
          class="hudBig"
          id="hudName"
        >
          Phantom
        </div>

      </div>


      <div class="hudCard">

        <div class="hudSmall">
          SCORE
        </div>

        <div
          class="hudBig"
          id="score"
        >
          0
        </div>

      </div>


      <div class="hudCard">

        <div class="hudSmall">
          HOSTILES
        </div>

        <div
          class="hudBig"
          id="enemies"
        >
          0
        </div>

      </div>

    </div>


    <div id="objective">
      OPERATION READY
    </div>


    <div id="crosshair"></div>


    <div id="message"></div>


    <div id="bottomHud">

      <div
        class="hudPanel"
        id="healthPanel"
      >

        <div class="healthRow">

          <div class="hudSmall">
            VITALS
          </div>

          <div id="hpText">
            100
          </div>

        </div>

        <div class="bar">

          <div id="hpFill"></div>

        </div>

      </div>


      <div
        class="hudPanel"
        id="weaponPanel"
      >

        <div id="weaponName">
          PRIMARY
        </div>

        <div id="ammo">
          30
          <span>/ 120</span>
        </div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       MOBILE CONTROLS
       CORE WILL SHOW THIS AFTER DEPLOY
  ====================================================== -->

  <div id="mobile">

    <div
      class="stick"
      id="moveStick"
    >
      <div class="knob"></div>
    </div>


    <div
      class="stick"
      id="lookStick"
    >
      <div class="knob"></div>
    </div>


    <button
      class="mobileButton"
      id="fire"
      type="button"
    >
      FIRE
    </button>


    <button
      class="mobileButton"
      id="reload"
      type="button"
    >
      R
    </button>


    <button
      class="mobileButton"
      id="crouch"
      type="button"
    >
      CROUCH
    </button>


    <button
      class="mobileButton"
      id="sprint"
      type="button"
    >
      RUN
    </button>


    <button
      class="mobileButton"
      id="jump"
      type="button"
    >
      JUMP
    </button>

  </div>


  <!-- =====================================================
       MODULAR GAME ENTRY
  ====================================================== -->

  <script type="module" src="./src/main.js"></script>

</body>
</html>
