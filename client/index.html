<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             minimum-scale=1,
             viewport-fit=cover,
             user-scalable=no"
  />

  <meta name="theme-color" content="#05070a" />

  <title>LAST LINE</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      color: #e8edf2;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    button,
    select,
    input {
      font: inherit;
    }

    /* =========================================================
       GAME
       ========================================================= */

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
    }

    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* =========================================================
       MAIN MENU
       ========================================================= */

    #menu {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(65, 80, 95, 0.18),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          rgba(2, 5, 8, 0.72),
          rgba(2, 5, 8, 0.96)
        );
    }

    .menu-panel {
      width: min(460px, 94vw);
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 18px;
      background:
        linear-gradient(
          180deg,
          rgba(16, 21, 27, 0.96),
          rgba(8, 11, 15, 0.97)
        );
      box-shadow:
        0 30px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .logo {
      margin-bottom: 4px;
      font-size: clamp(42px, 11vw, 72px);
      font-weight: 900;
      letter-spacing: 0.12em;
      line-height: 0.95;
      color: #f2f5f7;
      text-shadow: 0 5px 30px rgba(255,255,255,0.08);
    }

    .subtitle {
      margin-bottom: 28px;
      color: #7f8b96;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #8d99a4;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 9px;
      outline: none;
      background: rgba(255,255,255,0.045);
      color: #f0f3f5;
    }

    .field input:focus,
    .field select:focus {
      border-color: rgba(130,170,200,0.55);
    }

    .field select option {
      background: #10151a;
      color: white;
    }

    #deployButton {
      width: 100%;
      height: 54px;
      margin-top: 8px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: #e7edf2;
      color: #090c10;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition:
        transform 0.12s ease,
        background 0.12s ease;
    }

    #deployButton:active {
      transform: scale(0.98);
    }

    #deployButton:hover {
      background: #ffffff;
    }

    #menuStatus {
      min-height: 18px;
      margin-top: 13px;
      color: #71808b;
      text-align: center;
      font-size: 12px;
    }

    .mode-info {
      margin-top: 17px;
      padding-top: 17px;
      border-top: 1px solid rgba(255,255,255,0.07);
      color: #65727d;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    /* =========================================================
       LOADING
       ========================================================= */

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      background: #05070a;
    }

    .loading-box {
      width: min(400px, 84vw);
      text-align: center;
    }

    .loading-title {
      margin-bottom: 18px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .loading-track {
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
    }

    #loadingProgress {
      width: 0%;
      height: 100%;
      background: #dfe7ed;
      transition: width 0.2s ease;
    }

    /* =========================================================
       HUD
       ========================================================= */

    #hud {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: none;
    }

    #hudTop {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .hud-card {
      min-width: 150px;
      padding: 10px 13px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: rgba(4,7,10,0.60);
      backdrop-filter: blur(7px);
    }

    .hud-label {
      color: #788692;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .hud-value {
      margin-top: 3px;
      color: #edf2f5;
      font-size: 14px;
      font-weight: 800;
    }

    #hudCenter {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #crosshair {
      width: 18px;
      height: 18px;
      position: relative;
      opacity: 0.8;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.8);
    }

    #crosshair::before {
      width: 2px;
      height: 18px;
      left: 8px;
      top: 0;
    }

    #crosshair::after {
      width: 18px;
      height: 2px;
      left: 0;
      top: 8px;
    }

    #hudBottom {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 15px;
    }

    .hud-stat {
      min-width: 120px;
      padding: 11px 13px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: rgba(4,7,10,0.62);
      backdrop-filter: blur(7px);
    }

    .bar {
      width: 160px;
      max-width: 30vw;
      height: 7px;
      margin-top: 6px;
      overflow: hidden;
      border-radius: 5px;
      background: rgba(255,255,255,0.10);
    }

    .bar-fill {
      width: 100%;
      height: 100%;
      background: #dfe7ed;
      transition: width 0.15s ease;
    }

    #objective {
      position: absolute;
      left: 50%;
      top: 76px;
      transform: translateX(-50%);
      width: min(520px, 80vw);
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 7px;
      background: rgba(4,7,10,0.55);
      color: #cbd4da;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    #message {
      position: absolute;
      left: 50%;
      bottom: 22%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-align: center;
      text-shadow: 0 3px 20px #000;
    }

    /* =========================================================
       MOBILE CONTROLS
       ========================================================= */

    #mobile {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      pointer-events: none;
    }

    .stick-zone {
      position: absolute;
      bottom: 30px;
      width: 145px;
      height: 145px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 50%;
      background: rgba(255,255,255,0.035);
      pointer-events: auto;
      touch-action: none;
    }

    #moveStick {
      left: 25px;
    }

    #lookStick {
      right: 25px;
    }

    .stick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 60px;
      height: 60px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      pointer-events: none;
    }

    .mobile-buttons {
      position: absolute;
      right: 25px;
      bottom: 190px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }

    .mobile-button {
      width: 62px;
      height: 62px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      background: rgba(5,8,12,0.58);
      color: #eef2f4;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      touch-action: manipulation;
    }

    .mobile-button:active {
      background: rgba(255,255,255,0.20);
      transform: scale(0.94);
    }

    #fire {
      width: 78px;
      height: 78px;
      border-color: rgba(255,255,255,0.25);
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (pointer: coarse) {
      #mobile {
        display: block;
      }

      #hudBottom {
        bottom: 190px;
      }

      .hud-stat {
        min-width: 95px;
      }

      .bar {
        width: 110px;
      }
    }

    @media (max-width: 600px) {
      #menu {
        padding: 14px;
      }

      .menu-panel {
        padding: 23px;
      }

      .logo {
        font-size: 44px;
      }

      #hudTop {
        left: 10px;
        right: 10px;
      }

      #hudBottom {
        left: 10px;
        right: 10px;
      }

      .hud-card {
        min-width: 105px;
        padding: 8px 10px;
      }

      .stick-zone {
        width: 125px;
        height: 125px;
        bottom: 20px;
      }

      #moveStick {
        left: 15px;
      }

      #lookStick {
        right: 15px;
      }

      .mobile-buttons {
        right: 15px;
        bottom: 165px;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       THREE.JS GAME CANVAS
       ======================================================== -->

  <div id="game"></div>

  <!-- =======================================================
       MAIN MENU
       ======================================================== -->

  <div id="menu">
    <div class="menu-panel">

      <div class="logo">LAST LINE</div>

      <div class="subtitle">
        Tactical Operations
      </div>

      <div class="field">
        <label for="callsign">Callsign</label>

        <input
          id="callsign"
          type="text"
          value="PHANTOM"
          maxlength="16"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div class="field">
        <label for="mode">Operation</label>

        <select id="mode">
          <option value="survival">
            SURVIVAL
          </option>

          <option value="hostage">
            RESCUE HOSTAGE
          </option>

          <option value="tdm">
            TEAM DEATHMATCH
          </option>

          <option value="hvt">
            HIGH VALUE TARGET
          </option>
        </select>
      </div>

      <button id="deployButton" type="button">
        DEPLOY
      </button>

      <div id="menuStatus"></div>

      <div class="mode-info">
        Touch the left side to move.<br>
        Drag the right side to look around.<br>
        FIRE / RELOAD / SPRINT controls appear in combat.
      </div>

    </div>
  </div>

  <!-- =======================================================
       LOADING SCREEN
       ======================================================== -->

  <div id="loadingScreen">
    <div class="loading-box">

      <div class="loading-title">
        Preparing Operation
      </div>

      <div class="loading-track">
        <div id="loadingProgress"></div>
      </div>

    </div>
  </div>

  <!-- =======================================================
       HUD
       ======================================================== -->

  <div id="hud">

    <div id="hudTop">

      <div class="hud-card">
        <div class="hud-label">
          Operator
        </div>

        <div
          id="hudName"
          class="hud-value"
        >
          PHANTOM
        </div>
      </div>

      <div class="hud-card">
        <div class="hud-label">
          Level
        </div>

        <div
          id="level"
          class="hud-value"
        >
          1
        </div>
      </div>

    </div>

    <div id="objective">
      OBJECTIVE: DEPLOY
    </div>

    <div id="hudCenter">
      <div id="crosshair"></div>
    </div>

    <div id="message"></div>

    <div id="hudBottom">

      <div class="hud-stat">

        <div class="hud-label">
          Health
        </div>

        <div
          id="health"
          class="hud-value"
        >
          100
        </div>

        <div class="bar">
          <div
            id="healthBar"
            class="bar-fill"
            style="width:100%"
          ></div>
        </div>

      </div>

      <div class="hud-stat">

        <div class="hud-label">
          Armor
        </div>

        <div
          id="armor"
          class="hud-value"
        >
          50
        </div>

        <div class="bar">
          <div
            id="armorBar"
            class="bar-fill"
            style="width:100%"
          ></div>
        </div>

      </div>

      <div class="hud-stat">

        <div class="hud-label">
          Enemies
        </div>

        <div
          id="enemies"
          class="hud-value"
        >
          0
        </div>

      </div>

      <div class="hud-stat">

        <div class="hud-label">
          Score
        </div>

        <div
          id="score"
          class="hud-value"
        >
          0
        </div>

      </div>

      <div class="hud-stat">

        <div class="hud-label">
          Weapon
        </div>

        <div
          id="weapon"
          class="hud-value"
        >
          CARBINE
        </div>

        <div
          id="ammo"
          class="hud-value"
        >
          30 / 150
        </div>

      </div>

    </div>

  </div>

  <!-- =======================================================
       MOBILE CONTROLS
       ======================================================== -->

  <div id="mobile">

    <div
      id="moveStick"
      class="stick-zone"
      aria-label="Movement"
    >
      <div class="stick-knob"></div>
    </div>

    <div
      id="lookStick"
      class="stick-zone"
      aria-label="Look"
    >
      <div class="stick-knob"></div>
    </div>

    <div class="mobile-buttons">

      <button
        id="fire"
        class="mobile-button"
        type="button"
      >
        FIRE
      </button>

      <button
        id="reload"
        class="mobile-button"
        type="button"
      >
        RELOAD
      </button>

      <button
        id="sprint"
        class="mobile-button"
        type="button"
      >
        RUN
      </button>

      <button
        id="crouch"
        class="mobile-button"
        type="button"
      >
        CROUCH
      </button>

      <button
        id="jump"
        class="mobile-button"
        type="button"
      >
        JUMP
      </button>

    </div>

  </div>

  <!-- =======================================================
       ENTRY POINT
       ======================================================== -->

  <script
    type="module"
    src="./src/main.js"
  ></script>

</body>
</html>
