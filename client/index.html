<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <title>LAST LINE</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05080b;
      color: #e9f7ff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      touch-action: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    #game {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* =========================
       MAIN MENU
    ========================= */

    #menu {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 30%, rgba(0, 190, 255, 0.08), transparent 35%),
        linear-gradient(135deg, #030609, #081016 55%, #030507);
    }

    .menuBox {
      width: min(520px, 94vw);
      padding: 34px;
      border: 1px solid rgba(70, 220, 255, 0.28);
      border-radius: 18px;
      background: rgba(7, 13, 18, 0.88);
      box-shadow:
        0 0 60px rgba(0, 180, 255, 0.08),
        inset 0 0 35px rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(18px);
    }

    .logo {
      font-size: clamp(42px, 11vw, 72px);
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #eafaff;
      text-shadow:
        0 0 8px rgba(70, 220, 255, 0.65),
        0 0 35px rgba(0, 150, 255, 0.22);
    }

    .subtitle {
      margin-top: 5px;
      margin-bottom: 32px;
      color: #67cbe8;
      font-size: 12px;
      letter-spacing: 0.25em;
      font-weight: 700;
    }

    .label {
      display: block;
      margin: 18px 0 7px;
      color: #72909e;
      font-size: 11px;
      letter-spacing: 0.18em;
      font-weight: 700;
    }

    #callsign,
    #mode {
      width: 100%;
      height: 48px;
      border: 1px solid rgba(100, 200, 230, 0.22);
      border-radius: 9px;
      outline: none;
      background: rgba(0, 0, 0, 0.32);
      color: #eafaff;
      padding: 0 15px;
    }

    #callsign:focus,
    #mode:focus {
      border-color: rgba(70, 220, 255, 0.65);
      box-shadow: 0 0 18px rgba(0, 180, 255, 0.08);
    }

    #mode option {
      background: #091016;
      color: white;
    }

    #deployButton {
      width: 100%;
      height: 56px;
      margin-top: 26px;
      border: 1px solid rgba(120, 235, 255, 0.65);
      border-radius: 10px;
      background:
        linear-gradient(
          180deg,
          rgba(45, 190, 230, 0.18),
          rgba(15, 90, 115, 0.14)
        );
      color: #dffaff;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.2em;
      cursor: pointer;
      box-shadow:
        0 0 22px rgba(0, 190, 255, 0.08),
        inset 0 0 20px rgba(50, 220, 255, 0.04);
    }

    #deployButton:active {
      transform: scale(0.985);
      background: rgba(50, 190, 230, 0.25);
    }

    #deployButton:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #menuStatus {
      min-height: 18px;
      margin-top: 15px;
      text-align: center;
      color: #6ebbd0;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    /* =========================
       LOADING
    ========================= */

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: #030608;
    }

    .loadingBox {
      width: min(420px, 82vw);
      text-align: center;
    }

    .loadingTitle {
      margin-bottom: 18px;
      font-size: 13px;
      letter-spacing: 0.22em;
      color: #7fdcf2;
      font-weight: 800;
    }

    .loadingTrack {
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
    }

    #loadingProgress {
      width: 0%;
      height: 100%;
      background: #63dcff;
      box-shadow: 0 0 15px #63dcff;
      transition: width 0.15s linear;
    }

    /* =========================
       HUD
    ========================= */

    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      pointer-events: none;
    }

    .topLeft {
      position: absolute;
      top: 18px;
      left: 18px;
      min-width: 210px;
    }

    .playerName {
      color: #dffaff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    #lvl {
      margin-top: 4px;
      color: #61cce8;
      font-size: 11px;
      letter-spacing: 0.15em;
    }

    .topRight {
      position: absolute;
      top: 18px;
      right: 18px;
      text-align: right;
    }

    #hostiles,
    #score {
      color: #eafaff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    #xp {
      margin-top: 4px;
      color: #65cde8;
      font-size: 11px;
    }

    .objectiveBox {
      position: absolute;
      top: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 78vw);
      text-align: center;
      padding: 10px 16px;
      border-top: 1px solid rgba(90, 220, 255, 0.18);
      border-bottom: 1px solid rgba(90, 220, 255, 0.18);
      background: rgba(0, 10, 15, 0.28);
      color: #b9eaf7;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    #cross {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
    }

    #cross::before,
    #cross::after {
      content: "";
      position: absolute;
      background: rgba(220, 250, 255, 0.9);
      box-shadow: 0 0 5px rgba(70, 220, 255, 0.4);
    }

    #cross::before {
      width: 2px;
      height: 20px;
      left: 9px;
      top: 0;
    }

    #cross::after {
      height: 2px;
      width: 20px;
      left: 0;
      top: 9px;
    }

    #msg {
      position: absolute;
      left: 50%;
      bottom: 19%;
      transform: translateX(-50%);
      color: #dffaff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-align: center;
      text-shadow: 0 2px 8px #000;
    }

    .bottomLeft {
      position: absolute;
      left: 18px;
      bottom: 18px;
      width: min(280px, 45vw);
    }

    .healthTrack,
    .xpTrack {
      width: 100%;
      height: 8px;
      overflow: hidden;
      margin-top: 6px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    #hpf,
    #xpf {
      width: 100%;
      height: 100%;
      transition: width 0.15s linear;
    }

    #hpf {
      background: #46dc8a;
    }

    #xpf {
      background: #5fcfff;
    }

    #hptext {
      color: #dffaff;
      font-size: 11px;
      font-weight: 800;
    }

    .weaponBox {
      position: absolute;
      right: 18px;
      bottom: 18px;
      text-align: right;
    }

    #wname {
      color: #dffaff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    #ammo {
      margin-top: 3px;
      color: #72d5ee;
      font-size: 13px;
      font-weight: 700;
    }

    /* =========================
       MOBILE
    ========================= */

    #mobile {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
    }

    #moveArea,
    #lookArea {
      position: absolute;
      pointer-events: auto;
      touch-action: none;
    }

    #moveArea {
      left: 0;
      bottom: 0;
      width: 48%;
      height: 52%;
    }

    #lookArea {
      right: 0;
      top: 0;
      width: 58%;
      height: 75%;
    }

    .stick {
      position: absolute;
      width: 112px;
      height: 112px;
      border: 1px solid rgba(130, 220, 240, 0.18);
      border-radius: 50%;
      background: rgba(5, 20, 27, 0.15);
    }

    #moveStick {
      left: 38px;
      bottom: 40px;
    }

    .stickKnob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 48px;
      height: 48px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(130, 220, 240, 0.28);
      background: rgba(90, 210, 235, 0.12);
    }

    .mobileButton {
      position: absolute;
      pointer-events: auto;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid rgba(140, 225, 245, 0.28);
      background: rgba(5, 15, 20, 0.45);
      color: #dffaff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      touch-action: none;
    }

    #fire {
      right: 32px;
      bottom: 72px;
      width: 76px;
      height: 76px;
      border-color: rgba(255, 110, 90, 0.4);
    }

    #reload {
      right: 120px;
      bottom: 38px;
    }

    #sprint {
      left: 160px;
      bottom: 42px;
    }

    #crouch {
      left: 160px;
      bottom: 112px;
    }

    #jump {
      right: 120px;
      bottom: 118px;
    }

    /* Only reveal mobile gameplay controls after the game starts. */
    @media (pointer: coarse) {
      #mobile {
        display: none;
      }
    }

    @media (max-width: 700px) {
      .menuBox {
        padding: 25px 20px;
      }

      .logo {
        font-size: 48px;
      }

      .objectiveBox {
        top: 74px;
        width: 90vw;
        font-size: 10px;
      }

      .topLeft {
        top: 12px;
        left: 12px;
      }

      .topRight {
        top: 12px;
        right: 12px;
      }

      .bottomLeft {
        left: 12px;
        bottom: 12px;
        width: 42vw;
      }

      .weaponBox {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>

  <div id="game"></div>

  <!-- =========================
       MAIN MENU
  ========================= -->

  <section id="menu">
    <div class="menuBox">

      <div class="logo">LAST LINE</div>

      <div class="subtitle">
        TACTICAL CO-OP OPERATIONS
      </div>

      <label class="label" for="callsign">
        CALLSIGN
      </label>

      <input
        id="callsign"
        type="text"
        maxlength="18"
        autocomplete="off"
        value="Phantom"
        placeholder="Enter callsign"
      />

      <label class="label" for="mode">
        OPERATION
      </label>

      <select id="mode">

        <option value="rescue">
          RESCUE THE HOSTAGE
        </option>

        <option value="survival">
          SURVIVAL
        </option>

        <option value="tdm">
          TEAM DEATHMATCH
        </option>

        <option value="hvt">
          HIGH VALUE TARGET
        </option>

      </select>

      <button id="deployButton">
        DEPLOY
      </button>

      <div id="menuStatus">
        READY FOR DEPLOYMENT
      </div>

    </div>
  </section>

  <!-- =========================
       LOADING SCREEN
  ========================= -->

  <section id="loadingScreen">

    <div class="loadingBox">

      <div class="loadingTitle">
        INITIALIZING OPERATION
      </div>

      <div class="loadingTrack">
        <div id="loadingProgress"></div>
      </div>

    </div>

  </section>

  <!-- =========================
       HUD
  ========================= -->

  <section id="hud">

    <div class="topLeft">

      <div class="playerName" id="hudName">
        PHANTOM
      </div>

      <div id="lvl">
        LEVEL 1
      </div>

    </div>

    <div class="topRight">

      <div id="hostiles">
        HOSTILES: 0
      </div>

      <div id="score">
        SCORE: 0
      </div>

      <div id="xp">
        XP: 0
      </div>

    </div>

    <div class="objectiveBox" id="objective">
      OBJECTIVE: DEPLOY
    </div>

    <div id="cross"></div>

    <div id="msg"></div>

    <div class="bottomLeft">

      <div id="hptext">
        HP 100
      </div>

      <div class="healthTrack">
        <div id="hpf"></div>
      </div>

      <div class="xpTrack">
        <div id="xpf"></div>
      </div>

    </div>

    <div class="weaponBox">

      <div id="wname">
        CARBINE
      </div>

      <div id="ammo">
        30 / 120
      </div>

    </div>

  </section>

  <!-- =========================
       MOBILE CONTROLS
  ========================= -->

  <section id="mobile">

    <div id="moveArea">

      <div id="moveStick" class="stick">
        <div class="stickKnob"></div>
      </div>

    </div>

    <div id="lookArea"></div>

    <button
      id="fire"
      class="mobileButton"
    >
      FIRE
    </button>

    <button
      id="reload"
      class="mobileButton"
    >
      RELOAD
    </button>

    <button
      id="sprint"
      class="mobileButton"
    >
      RUN
    </button>

    <button
      id="crouch"
      class="mobileButton"
    >
      CROUCH
    </button>

    <button
      id="jump"
      class="mobileButton"
    >
      JUMP
    </button>

  </section>

  <!-- IMPORTANT:
       This is the ONLY game script.
       Do not keep the old giant inline Three.js script below it.
  -->

  <script
    type="module"
    src="./src/main.js"
  ></script>

</body>
</html>
